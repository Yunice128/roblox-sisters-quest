<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roblox Sisters Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#91c9e8;font-family:Arial,"Microsoft YaHei",sans-serif;color:white}
canvas{display:block;touch-action:none}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.45}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#282044;z-index:100;font-size:18px}
#topbar{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;z-index:5;pointer-events:none}
.stat{background:#211a3dcc;border:1px solid #ffffff55;border-radius:12px;padding:8px 10px;font-size:12px;pointer-events:auto}
#playerName{font-weight:bold;color:#ffe28a}
#switch{background:#7546a8;color:white}
#hint{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#241c42eF;padding:10px 16px;border-radius:14px;z-index:8;display:none;text-align:center;max-width:90%;font-size:13px}
#interact{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:8;background:#ffdf79;color:#42285e;min-width:150px;display:none}
#joystick{position:fixed;bottom:25px;left:20px;width:116px;height:116px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff80;z-index:6;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #9b77ce;left:32px;top:32px;pointer-events:none}
#jump{position:fixed;bottom:42px;right:25px;width:76px;height:76px;border-radius:50%;background:#ffcf6e;color:#573a7b;z-index:6}
#play{background:#ffdc78;color:#40285d;font-size:17px;padding:14px 28px}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(#251a4dcc,#302052ee);display:flex;align-items:center;justify-content:center;padding:20px}
#startcard{width:min(420px,95vw);padding:25px;border-radius:24px;background:#49336d;border:2px solid #d6b6ff;text-align:center}
#startcard h1{color:#ffe28a;font-size:25px}
#startcard p{line-height:1.7;font-size:14px}
.panel{position:fixed;inset:0;z-index:30;background:#090615c9;display:none;align-items:center;justify-content:center;padding:12px}
.panel-card{width:min(540px,96vw);max-height:88vh;overflow:auto;background:#392858;border:2px solid #c7a4f3;border-radius:20px;padding:18px;box-shadow:0 12px 40px #0008}
.panel-card h2{margin:0 0 12px;color:#ffe28a}
.panel-card p{font-size:13px;line-height:1.6}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.panel-actions button{flex:1;background:#ffdf8b;color:#382252}
.close-btn{background:#76618f!important;color:white!important}
.task-section{margin-top:14px;padding:12px;border-radius:15px}
.task-row{display:flex;align-items:center;gap:8px;background:#ffffff12;border:1px solid #ffffff30;border-radius:10px;padding:9px;margin:7px 0}
.task-info{flex:1;font-size:12px;line-height:1.5}
.task-row button{font-size:11px;padding:8px;background:#7548b8;color:white}
.progress-bg{height:9px;background:#ffffff30;border-radius:20px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:#ff9bcf;border-radius:20px}
.shop-item,.collection-row{padding:12px;margin:9px 0;border:1px solid #c4a3ff;border-radius:13px;background:#ffffff12}
.shop-item button{margin-top:8px;background:#ffdf8b;color:#34205e}
#reward{position:fixed;inset:0;z-index:40;background:#000b;display:none;align-items:center;justify-content:center}
#reward .panel-card{text-align:center}
#petPanel,#collectionPanel{z-index:35}
@media(max-width:600px){
 .stat{font-size:10px;padding:7px}
 #topbar{gap:4px}
 #joystick{width:108px;height:108px}
 #stick{left:29px;top:29px}
}
</style>
</head>
<body>
<div id="loading">正在准备 3D 冒险世界……</div>

<div id="topbar">
 <div class="stat">
  <div id="playerName">当前：姐姐</div>
  <div>⭐ XP：<span id="xp">0</span></div>
 </div>
 <div class="stat">
  💎 <span id="gems">0</span>
  <br>🪙 <span id="coins">0</span>
 </div>
 <button id="switch">切换带队</button>
</div>

<div id="hint"></div>
<button id="interact">互动</button>
<div id="joystick"><div id="stick"></div></div>
<button id="jump">跳跃</button>

<div id="start">
 <div id="startcard">
  <h1>✨ Sisters Adventure ✨</h1>
  <p>姐妹一起探索 Habit City！<br>
  完成家庭任务、收集宝石、照顾宠物，<br>
  赚取金币并购买漂亮的皇冠。</p>
  <p>左边摇杆移动，滑动画面转动视角，右边按钮跳跃。</p>
  <button id="play">进入 3D 世界</button>
 </div>
</div>

<div class="panel" id="taskPanel">
 <div class="panel-card">
  <h2>🏡 家庭任务中心</h2>
  <p id="taskProgress"></p>
  <div id="taskList"></div>
  <div class="panel-actions">
   <button class="close-btn" id="closeTasks">关闭</button>
  </div>
 </div>
</div>

<div class="panel" id="shopPanel">
 <div class="panel-card">
  <h2>✨ 魔法商店</h2>
  <p id="shopWallet"></p>
  <div id="shopItems"></div>
  <div class="panel-actions">
   <button class="close-btn" id="closeShop">关闭商店</button>
  </div>
 </div>
</div>

<div class="panel" id="petPanel">
 <div class="panel-card">
  <h2 id="petTitle">宠物成长中心</h2>
  <p id="petLevel"></p>
  <p id="petExperience"></p>
  <p id="petWallet"></p>
  <p id="petSkillInfo"></p>
  <div class="panel-actions">
   <button id="feedPet">喂食宠物</button>
   <button id="petSkillBtn">宠物技能</button>
   <button class="close-btn" id="closePet">关闭</button>
  </div>
 </div>
</div>

<div class="panel" id="collectionPanel">
 <div class="panel-card">
  <h2>🎒 收藏与成长记录</h2>
  <div id="collectionContent"></div>
  <div class="panel-actions">
   <button class="close-btn" id="closeCollection">关闭</button>
  </div>
 </div>
</div>

<div id="reward">
 <div class="panel-card">
  <h2>🎉 宝箱奖励</h2>
  <p>获得 50 XP、1 颗宝石，姐姐和妹妹各获得 30 金币！</p>
  <button id="rewardOK">太好了！</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

try{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9e8);
scene.fog=new THREE.Fog(0x91c9e8,35,75);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x64805a,2);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-12,22,10);
sun.castShadow=true;
scene.add(sun);

const mat=color=>new THREE.MeshStandardMaterial({color,roughness:.8});
const grass=mat(0x72b96b);
const stone=mat(0x9c9caa);
const gold=mat(0xffd45c);
const wood=mat(0x80502f);
const skin=mat(0xffd0ae);
const hair=mat(0x563a32);
const eye=mat(0x241a32);
const pants=mat(0x5269a5);
const shoe=mat(0xeeeeee);
const shirt1=mat(0xff83c9);
const shirt2=mat(0x8c8cff);
const white=mat(0xffffff);
const leaf=mat(0x48a85b);

function box(parent,w,h,d,material,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

const island=new THREE.Mesh(
 new THREE.CylinderGeometry(25,27,1.4,64),
 grass
);
island.position.y=-.8;
island.receiveShadow=true;
scene.add(island);

const water=new THREE.Mesh(
 new THREE.CylinderGeometry(34,34,.3,64),
 new THREE.MeshStandardMaterial({color:0x389fc7,roughness:.3})
);
water.position.y=-1.65;
scene.add(water);

const ground=new THREE.Mesh(
 new THREE.CircleGeometry(24,64),
 grass
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
ground.receiveShadow=true;
scene.add(ground);

for(let i=0;i<14;i++){
 const a=i*2.1,r=5+(i%4)*3;
 const x=Math.cos(a)*r,z=Math.sin(a)*r;
 const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.45,0),stone);
 rock.position.set(x,.25,z);
 rock.castShadow=true;
 scene.add(rock);
}
// ===== HABIT CITY =====
const habitCity=new THREE.Group();
habitCity.position.set(-4,0,13);
scene.add(habitCity);

const cityGround=new THREE.Mesh(
 new THREE.CylinderGeometry(6.5,6.5,.2,48),
 mat(0x82b879)
);
cityGround.position.y=.02;
habitCity.add(cityGround);

const cityRoad=new THREE.Mesh(
 new THREE.BoxGeometry(2.5,.12,16),
 mat(0xc5b9a8)
);
cityRoad.position.set(0,.16,-2);
habitCity.add(cityRoad);

const buildings=[
 {x:-4,z:-2,color:0xffb86b,label:'FAMILY TASK'},
 {x:4,z:-2,color:0x79b9e8,label:'MAGIC SHOP'},
 {x:-4,z:3,color:0xc49be8,label:'PET CENTER'}
];

buildings.forEach(b=>{
 const body=box(habitCity,2.5,3,2.5,mat(b.color),b.x,1.6,b.z);
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(1.9,1.5,4),
  mat(0x7546a8)
 );
 roof.position.set(b.x,3.85,b.z);
 roof.rotation.y=Math.PI/4;
 habitCity.add(roof);
 box(habitCity,.65,1.35,.12,mat(0x70452e),b.x,.85,b.z+1.31);

 const canvas=document.createElement('canvas');
 canvas.width=768;canvas.height=192;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#48266f';ctx.fillRect(0,0,768,192);
 ctx.strokeStyle='#ffd45c';ctx.lineWidth=10;
 ctx.strokeRect(6,6,756,180);
 ctx.fillStyle='#ffe28a';ctx.font='bold 52px Arial';
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(b.label,384,96);
 const texture=new THREE.CanvasTexture(canvas);
 const sign=new THREE.Mesh(
  new THREE.PlaneGeometry(2.2,.55),
  new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide})
 );
 sign.position.set(b.x,2.45,b.z+1.38);
 habitCity.add(sign);
});

const habitGate=new THREE.Group();
habitGate.position.set(-4,0,3.2);
scene.add(habitGate);
box(habitGate,.65,3.5,.7,mat(0x8055a8),-2.1,1.75,0);
box(habitGate,.65,3.5,.7,mat(0x8055a8),2.1,1.75,0);
box(habitGate,5.1,.65,.85,gold,0,3.65,0);
box(habitGate,3.7,.8,.18,mat(0x48266f),0,3.65,.48);

const gateCanvas=document.createElement('canvas');
gateCanvas.width=1024;gateCanvas.height=256;
const gateCtx=gateCanvas.getContext('2d');
gateCtx.fillStyle='#ffe28a';
gateCtx.font='bold 100px Arial';
gateCtx.textAlign='center';
gateCtx.textBaseline='middle';
gateCtx.fillText('HABIT CITY',512,128);
const gateText=new THREE.Mesh(
 new THREE.PlaneGeometry(3.5,.75),
 new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(gateCanvas),transparent:true})
);
gateText.position.set(0,3.65,.59);
habitGate.add(gateText);

const arch=new THREE.Mesh(
 new THREE.TorusGeometry(1.75,.12,12,48,Math.PI),
 gold
);
arch.position.set(0,2.6,.2);
habitGate.add(arch);

// Task NPC
const taskNPC=new THREE.Group();
taskNPC.position.set(-8,0,14.5);
scene.add(taskNPC);
box(taskNPC,.8,1.1,.55,mat(0xffc66d),0,.9,0);
box(taskNPC,.65,.65,.65,skin,0,1.75,0);

// Task board
const taskBoard=new THREE.Group();
taskBoard.position.set(-8,0,15.8);
scene.add(taskBoard);
box(taskBoard,2.2,1.6,.18,mat(0x7546a8),0,1.5,0);
box(taskBoard,2.35,.18,.25,gold,0,2.35,0);

// Magic shop interaction location
const magicShopPosition=new THREE.Vector3(0,0,11);

// Plaza decoration
const plaza=new THREE.Mesh(
 new THREE.CylinderGeometry(5.2,5.2,.18,48),
 mat(0x9b91b8)
);
plaza.position.set(-8,.02,-2);
scene.add(plaza);

for(const x of [-7.2,-.8]){
 const pillar=box(scene,.55,2.5,.55,mat(0x8065a8),x,1.25,-2);
 box(scene,.85,.22,.85,gold,x,2.55,-2);
}

// Chest
const chest=new THREE.Group();
chest.position.set(4,0,-1);
scene.add(chest);
box(chest,1.5,.82,1.05,mat(0x9b572d),0,.48,0);
const lid=box(chest,1.58,.3,1.12,mat(0x75452b),0,.99,0);
box(chest,.18,.85,1.13,gold,0,.55,.02);
box(chest,.34,.27,.08,gold,0,.55,.58);
const chestLight=new THREE.PointLight(0xffd35c,0,5);
chestLight.position.set(0,1.2,0);
chest.add(chestLight);

// Portal
const portal=new THREE.Group();
portal.position.set(0,0,-17);
scene.add(portal);
const portalRing=new THREE.Mesh(
 new THREE.TorusGeometry(1.8,.18,12,48),
 new THREE.MeshStandardMaterial({color:0xb987ff,emissive:0x6333a8,emissiveIntensity:1})
);
portalRing.position.y=2;
portal.add(portalRing);
const portalCore=new THREE.Mesh(
 new THREE.CircleGeometry(1.55,32),
 new THREE.MeshBasicMaterial({color:0x9c65e8,transparent:true,opacity:.35,side:THREE.DoubleSide})
);
portalCore.position.y=2;
portal.add(portalCore);

// ===== CHARACTERS =====
function avatar(top){
 const g=new THREE.Group(),arms=[],legs=[];
 box(g,.78,.95,.42,top,0,1.65,0);
 box(g,.68,.68,.64,skin,0,2.52,0);
 box(g,.72,.2,.68,mat(0x563a32),0,2.9,-.01);
 box(g,.18,.48,.67,mat(0x563a32),-.28,2.63,.02);
 box(g,.18,.48,.67,mat(0x563a32),.28,2.63,.02);
 box(g,.09,.09,.035,mat(0x241a32),-.15,2.55,.34);
 box(g,.09,.09,.035,mat(0x241a32),.15,2.55,.34);

 for(const x of [-.5,.5]){
  const a=new THREE.Group();
  a.position.set(x,2.02,0);
  g.add(a);
  box(a,.24,.72,.26,skin,0,-.34,0);
  arms.push(a);
 }
 for(const x of [-.22,.22]){
  const l=new THREE.Group();
  l.position.set(x,1.17,0);
  g.add(l);
  box(l,.28,.8,.32,mat(0x5269a5),0,-.4,0);
  box(l,.34,.18,.46,mat(0xeeeeee),0,-.82,.06);
  legs.push(l);
 }
 const wearables=new THREE.Group();
 g.add(wearables);
 scene.add(g);
 return {group:g,arms,legs,wearables};
}

const sisters=[avatar(shirt1),avatar(shirt2)];
sisters[0].group.position.set(0,0,5);
sisters[1].group.position.set(1.15,0,6.35);

let leader=sisters[0],follower=sisters[1],active='姐姐';
let mx=0,my=0,angle=0,pitch=.23,vy=0,onGround=true;
let nearbyTarget=null,nearbyOpened=false;
let hintTimer=null;

function hint(message){
 const el=document.getElementById('hint');
 el.textContent=message;
 el.style.display='block';
 if(hintTimer)clearTimeout(hintTimer);
 hintTimer=setTimeout(()=>el.style.display='none',3000);
}

// ===== SAVE DATA =====
function kualaLumpurDate(){
 const parts=new Intl.DateTimeFormat('en-GB',{
  timeZone:'Asia/Kuala_Lumpur',
  year:'numeric',month:'2-digit',day:'2-digit'
 }).formatToParts(new Date());
 const p={};
 parts.forEach(x=>p[x.type]=x.value);
 return p.year+'-'+p.month+'-'+p.day;
}

const key='sistersQuest3DRewards_v1';
let data={
 xp:0,gems:0,coins:30,chestClaimed:false,
 petGrowth:[{level:1,xp:0},{level:1,xp:0}],
 collectedItems:[]
};

try{
 data={...data,...JSON.parse(localStorage.getItem(key)||'{}')};
}catch(e){}

if(!Number.isFinite(data.coins))data.coins=30;
if(!Number.isFinite(data.xp))data.xp=0;
if(!Number.isFinite(data.gems))data.gems=0;
if(!Array.isArray(data.petGrowth)||data.petGrowth.length!==2){
 data.petGrowth=[{level:1,xp:0},{level:1,xp:0}];
}
data.petGrowth=data.petGrowth.map(p=>({
 level:Math.max(1,Number(p?.level)||1),
 xp:Math.max(0,Number(p?.xp)||0)
}));
if(!Array.isArray(data.collectedItems))data.collectedItems=[];

// One-time migration: split old shared coins between sisters
if(!data.characterCoins){
 const oldCoins=Math.max(0,Number(data.coins)||0);
 const share=Math.floor(oldCoins/2);
 data.characterCoins={
  姐姐:share,
  妹妹:share+(oldCoins%2)
 };
}
if(!Number.isFinite(data.characterCoins.姐姐))data.characterCoins.姐姐=0;
if(!Number.isFinite(data.characterCoins.妹妹))data.characterCoins.妹妹=0;

// Independent wardrobes
if(!data.wardrobes)data.wardrobes={};
if(!data.wardrobes.姐姐)data.wardrobes.姐姐={owned:[],equipped:{}};
if(!data.wardrobes.妹妹)data.wardrobes.妹妹={owned:[],equipped:{}};

// Daily family task progress
const todayTaskDate=kualaLumpurDate();
if(!data.familyTaskProgress||data.familyTaskProgress.date!==todayTaskDate){
 data.familyTaskProgress={date:todayTaskDate,姐姐:[],妹妹:[]};
}
if(!Array.isArray(data.familyTaskProgress.姐姐))data.familyTaskProgress.姐姐=[];
if(!Array.isArray(data.familyTaskProgress.妹妹))data.familyTaskProgress.妹妹=[];
if(!data.taskXP)data.taskXP={姐姐:0,妹妹:0};
if(!Number.isFinite(data.taskXP.姐姐))data.taskXP.姐姐=0;
if(!Number.isFinite(data.taskXP.妹妹))data.taskXP.妹妹=0;

// Daily collection progress
const todayKey=kualaLumpurDate();
if(!data.dailyCollection||data.dailyCollection.date!==todayKey){
 data.dailyCollection={date:todayKey,collectedItems:[]};
}
if(!Array.isArray(data.dailyCollection.collectedItems)){
 data.dailyCollection.collectedItems=[];
}

function saveData(){
 try{
  localStorage.setItem(key,JSON.stringify(data));
 }catch(e){
  hint('无法保存：请检查浏览器储存空间');
 }
}
// ===== FAMILY TASKS =====
const familyTasks=[
 ["不乱发脾气","Control my temper",25],
 ["10点前睡觉","Sleep before 10pm",30],
 ["主动温习功课","Revise proactively",35],
 ["30分钟内吃完饭","Finish meal within 30 min",25],
 ["东西放回原位","Put things back",20],
 ["不乱丢垃圾","Use the bin",20],
 ["吃完自己洗碗","Wash own dishes",25],
 ["整理书包和书本","Pack bag & books",25],
 ["水壶餐具拿去厨房","Take bottle & utensils to kitchen",20],
 ["主动帮忙做家务","Help with chores",30],
 ["没有看短视频","No short videos",40],
 ["8:15pm前吃完晚餐","Finish dinner by 8:15pm",30],
 ["两姐妹没有吵架","Peaceful sister teamwork",40],
 ["念国语/英语故事书","Read BM/English storybook",25],
 ["讲英语","Speak English",20],
 ["抄华语/国语/英语作文","Copy a Chinese/BM/English essay",35],
 ["听写80分或以上","Dictation score 80%+",50]
];

function stats(){
 document.getElementById('xp').textContent=data.xp;
 document.getElementById('gems').textContent=data.gems;
 document.getElementById('coins').textContent=data.characterCoins[active];
 document.getElementById('playerName').textContent='当前：'+active;
}

function renderFamilyTasks(){
 const list=document.getElementById('taskList');
 list.innerHTML='';
 ['姐姐','妹妹'].forEach(name=>{
  const done=data.familyTaskProgress[name];
  const section=document.createElement('div');
  section.className='task-section';
  section.style.background=name==='姐姐'?'#542b50':'#30366c';
  section.style.border='2px solid '+(name==='姐姐'?'#ff9bcf':'#9c9cff');

  const title=document.createElement('h3');
  title.textContent=name+' · 任务 XP：'+data.taskXP[name];
  title.style.color=name==='姐姐'?'#ff9bcf':'#a9adff';
  section.appendChild(title);

  const bar=document.createElement('div');
  bar.className='progress-bg';
  const fill=document.createElement('div');
  fill.className='progress-fill';
  fill.style.width=(done.length/17*100)+'%';
  if(name==='妹妹')fill.style.background='#9c9cff';
  bar.appendChild(fill);
  section.appendChild(bar);

  const percent=document.createElement('p');
  percent.textContent=(done.length/17*100).toFixed(1)+'% 完成';
  section.appendChild(percent);

  familyTasks.forEach((task,index)=>{
   const row=document.createElement('div');
   row.className='task-row';
   const info=document.createElement('div');
   info.className='task-info';

function usePetSkill(index){

  hint('宠物达到 Lv.2 才能解锁专属技能');

  hint('技能冷却中，请稍等 '+Math.ceil(petSkillReadyAt[index]-now)+' 秒');
  return;

  o.group.visible&&o.definition.kind===kind
 );

 if(!candidates.length){

  return;

 let target=null,best=Infinity;
 candidates.forEach(o=>{
  const d=owner.group.position.distanceTo(o.group.position);

 });

 const range=index===0?18:22;
 if(best>range){
  hint('发现目标，但距离太远，请继续探索！');
  return;
 }

 skillMarker.position.set(
  target.group.position.x,0,target.group.position.z
 );
 skillMarker.visible=true;
 skillMarkerExpires=now+8;
 petSkillReadyAt[index]=now+12;
 playPetAction(index);

 hint(
  (index===0?'兔兔跳跃寻宝！':'狐狸嗅觉寻宝！')+
  ' '+target.definition.emoji+' '+target.definition.name+
  ' 距离约 '+Math.round(best)+' 米，金色光柱已标记位置。'
 );
}

// ===== JOYSTICK =====
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
let jp=null,cx=0,cy=0;

joy.onpointerdown=e=>{
 e.preventDefault();
 jp=e.pointerId;
 const r=joy.getBoundingClientRect();
 cx=r.left+r.width/2;
 cy=r.top+r.height/2;
 joy.setPointerCapture(e.pointerId);
 joyMove(e);
};

function joyMove(e){
 if(jp!==e.pointerId)return;
 const dx=e.clientX-cx;
 const dy=e.clientY-cy;
 const len=Math.hypot(dx,dy);
 const k=len>42?42/len:1;
 mx=dx*k/42;
 my=dy*k/42;
 stick.style.transform='translate('+dx*k+'px,'+dy*k+'px)';
}

joy.onpointermove=joyMove;

function joyEnd(e){
 if(jp!==e.pointerId)return;
 jp=null;
 mx=0;
 my=0;
 stick.style.transform='translate(0,0)';
}
joy.onpointerup=joyEnd;
joy.onpointercancel=joyEnd;

// ===== CAMERA TOUCH CONTROL =====
let lp=null,lx=0,ly=0,downX=0,downY=0;

renderer.domElement.onpointerdown=e=>{
 if(e.clientX<innerWidth*.38)return;
 lp=e.pointerId;
 lx=e.clientX;
 ly=e.clientY;
 downX=e.clientX;
 downY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
};

renderer.domElement.onpointermove=e=>{
 if(lp!==e.pointerId)return;
 angle-=(e.clientX-lx)*.006;
 pitch=THREE.MathUtils.clamp(
  pitch+(e.clientY-ly)*.003,-.05,.65
 );
 lx=e.clientX;
 ly=e.clientY;
};

renderer.domElement.onpointerup=e=>{
 if(lp!==e.pointerId)return;

 const moved=Math.hypot(e.clientX-downX,e.clientY-downY);

 if(moved<12){
  const rect=renderer.domElement.getBoundingClientRect();
  const pointer=new THREE.Vector2(
   ((e.clientX-rect.left)/rect.width)*2-1,
   -((e.clientY-rect.top)/rect.height)*2+1
  );

  const raycaster=new THREE.Raycaster();
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObjects(petMeshes,false)[0];

  if(hit&&Number.isInteger(hit.object.userData.petIndex)){
   openPetPanel(hit.object.userData.petIndex);
  }
 }
 lp=null;
};

renderer.domElement.onpointercancel=()=>lp=null;

// ===== JUMP =====
document.getElementById('jump').onpointerdown=e=>{
 e.preventDefault();
 if(onGround){
  vy=7.2;
  onGround=false;
 }
};

// ===== START GAME =====
document.getElementById('play').onclick=()=>{
 document.getElementById('start').style.display='none';
 if(screen.orientation?.lock){
  screen.orientation.lock('landscape').catch(()=>{});
 }
};

const clock=new THREE.Clock();
let dailyDateCheck=Date.now();

function refreshDailyCollection(){
 const today=kualaLumpurDate();
 if(data.dailyCollection.date!==today){
  data.dailyCollection={
   date:today,
   collectedItems:[]
  };

  collectibleObjects.forEach(o=>o.group.visible=true);
  saveData();
  renderCollection();
  hint('新的一天开始了！食物和宝石已经重新出现。');
 }
}

// Add collection button
const collectionBtn=document.createElement('button');
collectionBtn.id='collectionBtn';
collectionBtn.textContent='🎒 收藏';
collectionBtn.style.cssText=
 'position:fixed;top:68px;right:10px;z-index:9;background:#7546a8;color:white';
document.body.appendChild(collectionBtn);

collectionBtn.onclick=()=>{
 renderCollection();
 document.getElementById('collectionPanel').style.display='flex';
};

// ===== MAIN GAME LOOP =====
function animate(){
 requestAnimationFrame(animate);

 if(Date.now()-dailyDateCheck>1000){
  dailyDateCheck=Date.now();
  refreshDailyCollection();
 }

 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;
 const p=leader.group;

 const forward=new THREE.Vector3(
  -Math.sin(angle),0,-Math.cos(angle)
 );
 const right=new THREE.Vector3(
  Math.cos(angle),0,-Math.sin(angle)
 );

 const move=new THREE.Vector3()
  .addScaledVector(right,mx)
  .addScaledVector(forward,-my);

 const moving=move.lengthSq()>.015;

 if(moving){
  move.normalize();
  p.position.addScaledVector(move,5.2*dt);
  p.rotation.y=Math.atan2(move.x,move.z);
 }

 p.position.x=THREE.MathUtils.clamp(p.position.x,-20,20);
 p.position.z=THREE.MathUtils.clamp(p.position.z,-20,19);

 vy-=18*dt;
 p.position.y+=vy*dt;

 if(p.position.y<=0){
  p.position.y=0;
  vy=0;
  onGround=true;
 }

 const desired=p.position.clone().add(
  new THREE.Vector3(
   -Math.sin(p.rotation.y),0,-Math.cos(p.rotation.y)
  ).multiplyScalar(1.65)
 );

 desired.x=THREE.MathUtils.clamp(desired.x,-20,20);
 desired.z=THREE.MathUtils.clamp(desired.z,-20,19);

 follower.group.position.lerp(
  desired,Math.min(1,dt*4.5)
 );
 follower.group.rotation.y=p.rotation.y;

 const followMoving=follower.group.position.distanceTo(desired)>.12||moving;

 function walk(character,isMoving,phase){
  const s=isMoving?Math.sin(t*10+phase)*.65:0;
  character.legs[0].rotation.x=s;
  character.legs[1].rotation.x=-s;
  character.arms[0].rotation.x=-s*.7;
  character.arms[1].rotation.x=s*.7;
 }

 walk(leader,moving,0);
 walk(follower,followMoving,1.2);

 // Pets follow their owners
 pets.forEach((pet,i)=>{
  const owner=sisters[i].group;
  const petGroup=pet.group;

  const back=new THREE.Vector3(
   -Math.sin(owner.rotation.y),0,-Math.cos(owner.rotation.y)
  );
  const side=new THREE.Vector3(
   Math.cos(owner.rotation.y),0,-Math.sin(owner.rotation.y)
  );

  const petTarget=owner.position.clone()
   .addScaledVector(back,1.25)
   .addScaledVector(side,i===0?-.82:.82);

  petTarget.x=THREE.MathUtils.clamp(petTarget.x,-20,20);
  petTarget.z=THREE.MathUtils.clamp(petTarget.z,-20,19);

  petGroup.position.x+=(petTarget.x-petGroup.position.x)*Math.min(1,dt*5);
  petGroup.position.z+=(petTarget.z-petGroup.position.z)*Math.min(1,dt*5);

  const ownerMoving=owner===p?moving:followMoving;
  petGroup.position.y=.06+
   (ownerMoving?Math.abs(Math.sin(t*8+i))*.13:Math.sin(t*2+i)*.035);

  const dx=owner.position.x-petGroup.position.x;
  const dz=owner.position.z-petGroup.position.z;

  if(Math.hypot(dx,dz)>.08){
   petGroup.rotation.y=Math.atan2(dx,dz);
  }

  const action=petActions[i];

  if(t<action.until){
   const progress=(t-action.start)/(action.until-action.start);

   if(action.type==='hop'){
    petGroup.position.y+=Math.sin(progress*Math.PI)*.95;
   }else if(action.type==='spin'){
    petGroup.rotation.y=action.baseRotation+progress*Math.PI*4;
   }else if(action.type==='eat'){
    petGroup.position.y+=Math.sin(progress*Math.PI)*.16;
    petGroup.rotation.x=Math.sin(progress*Math.PI*4)*.12;
   }
  }else if(action.type){
   action.type='';
   petGroup.rotation.x=0;
  }
 });

 // Heart particles
 for(let i=heartParticles.length-1;i>=0;i--){
  const h=heartParticles[i];
  h.life-=dt*1.15;
  h.mesh.position.y+=dt*1.25;
  h.mesh.material.opacity=Math.max(0,h.life);

  if(h.life<=0){
   scene.remove(h.mesh);
   h.mesh.geometry.dispose();
   h.mesh.material.dispose();
   heartParticles.splice(i,1);
  }
 }

 // Skill marker animation
 if(skillMarker.visible){
  if(t>=skillMarkerExpires){
   skillMarker.visible=false;
  }else{
   markerRing.rotation.z=t*1.8;
   markerStar.rotation.y=t*2.6;
   markerStar.position.y=3.15+Math.sin(t*4)*.22;
   markerBeam.material.opacity=.28+Math.sin(t*5)*.12;
  }
 }

 // Camera
 const target=new THREE.Vector3(
  p.position.x,p.position.y+1.45,p.position.z
 );
 const dist=8.2;
 const h=Math.cos(pitch)*dist;
 const v=Math.sin(pitch)*dist+2.2;

 camera.position.set(
  target.x+Math.sin(angle)*h,
  target.y+v,
  target.z+Math.cos(angle)*h
 );
 camera.lookAt(target);

 // Find nearest interaction
 let closest=null;
 let closestDistance=Infinity;

 function checkDistance(position,type,object,range){
  const d=Math.min(
   p.position.distanceTo(position),
   follower.group.position.distanceTo(position)
  );
  if(d<range&&d<closestDistance){
   closest={type,object};
   closestDistance=d;
  }
 }

 checkDistance(taskNPC.position,'task',null,3.2);
 checkDistance(magicShopPosition,'shop',null,3.5);

 if(!opened){
  checkDistance(chest.position,'chest',null,3);
 }

 collectibleObjects.forEach(object=>{
  if(object.group.visible){
   checkDistance(object.group.position,'pickup',object,2.35);
  }
 });

 progressObjects.forEach(object=>{
  if(object.group.visible){
   checkDistance(object.group.position,'node',object,2.1);
   object.group.rotation.y=t*.8+object.id;
   object.group.position.y=.08+Math.sin(t*2+object.id)*.12;
  }
 });

 nearbyTarget=closest;

 const interact=document.getElementById('interact');

 if(closest){
  interact.style.display='block';

  if(closest.type==='chest'){
   interact.textContent='开启宝箱';
  }else if(closest.type==='task'){
   interact.textContent='查看家庭任务';
  }else if(closest.type==='shop'){
   interact.textContent='进入魔法商店';
  }else if(closest.type==='pickup'){
   interact.textContent='收集 '+closest.object.definition.emoji;
  }else if(closest.type==='node'){
   interact.textContent='探索节点 '+(closest.object.id+1)+'/50';
  }
 }else{
  interact.style.display='none';
 }

 collectibleObjects.forEach((object,i)=>{
  if(object.group.visible){
   object.group.position.y=.08+Math.sin(t*2.2+i)*.12;
   object.group.rotation.y=t*.65+i;
  }
 });

 portal.rotation.y=Math.sin(t*.7)*.08;
 renderer.render(scene,camera);
}

stats();
renderCollection();
renderPetPanel();

document.getElementById('loading').style.display='none';

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
});

}catch(err){
 document.getElementById('loading').textContent=
  '3D 场景启动失败：'+(err?.message||'未知错误');
 document.getElementById('play').disabled=true;
 document.getElementById('play').textContent='场景启动失败';
 console.error(err);
}
</script>
</body>
</html>
